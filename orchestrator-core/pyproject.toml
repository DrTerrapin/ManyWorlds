[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestrator-core"
version = "0.1.0"
description = "Experiment/task orchestration engine with pluggable classical and quantum step providers"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3.0",
    "azure-cosmos>=4.5,<5.0",
]

[tool.setuptools.packages.find]
include = ["orchestrator_core*"]
